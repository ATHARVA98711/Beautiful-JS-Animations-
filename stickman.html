<canvas id="c" width="400" height="300" style="border:1px solid"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
function draw(x,y,s){
  ctx.beginPath(); ctx.arc(x,y,20,0,7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y+20); ctx.lineTo(x,y+80); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x,y+80); ctx.lineTo(x-s*0.5,y+130);
  ctx.moveTo(x,y+80); ctx.lineTo(x+s*0.5,y+130);
  ctx.moveTo(x,y+40); ctx.lineTo(x+s*0.4,y+80);
  ctx.moveTo(x,y+40); ctx.lineTo(x-s*0.4,y+80);
  ctx.stroke();
}
function loop(now){
  ctx.clearRect(0,0,400,300);
  let swing = Math.sin(now/200)*30;
  let x = 50 + (now/20)%300;
  draw(x,100,swing);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
